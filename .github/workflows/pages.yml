name: pages

# The village is a static bundle with no server and no secrets in it — the
# live keys only ever exist in MODE=live on someone's own machine. So the
# browser build can simply be published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces the one waiting, never the one
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as ci.yml: nothing reaches the public URL untested.
      - run: npm run typecheck
      - run: npm test

      # GITHUB_PAGES switches vite's base to /agent-arena/ for project pages.
      - run: npm run build
        env:
          GITHUB_PAGES: "1"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
